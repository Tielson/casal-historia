# Produção (Coolify). Domínios via SERVICE_FQDN_*; segredos ficam no painel do Coolify.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-$SERVICE_FQDN_API}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_PRICE_LABEL: ${NEXT_PUBLIC_PRICE_LABEL:-R$ 49,90}
    environment:
      - SERVICE_FQDN_WEB_3000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - SERVICE_FQDN_API_4000
      - NODE_ENV=production
      - PORT=4000
      - WEB_URL=${WEB_URL:-$SERVICE_FQDN_WEB}
      - CORS_ORIGIN=${CORS_ORIGIN:-$SERVICE_FQDN_WEB}
      - API_URL=${API_URL:-$SERVICE_FQDN_API}
      - DATABASE_URL=file:/data/app.db
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - REDIS_URL=redis://redis:6379
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DRAFT_COOKIE_NAME=${DRAFT_COOKIE_NAME:-en_draft}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_CENTS=${STRIPE_PRICE_CENTS:-4990}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-brl}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-nos-dois}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - MOCK_GENERATION=${MOCK_GENERATION:-true}
      - MAX_PREVIEW_REGENS=${MAX_PREVIEW_REGENS:-3}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TEXT_MODEL=${OPENAI_TEXT_MODEL:-gpt-5.4}
      - IMAGE_PROVIDER_API_KEY=${IMAGE_PROVIDER_API_KEY:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2.5-flare}
      - APP_NAME=${APP_NAME:-Entre Nós}
      - COMPANY_NAME=${COMPANY_NAME:-DominusHub}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-DominusHub}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_TEST_EVENT_CODE=${META_TEST_EVENT_CODE:-}
      - META_CAPI_ENABLED=${META_CAPI_ENABLED:-false}
    volumes:
      - api_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  api_data:
  redis_data:
